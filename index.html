<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Room</title>
<style>
/* Layout: slim top bar, then two panes split half and half. Tab on the left, video on the right. */
:root{
  --bg:#000000; --pane:#1c1c1e; --raise:#2c2c2e; --fg:#f5f5f7; --muted:#98989f; --line:rgba(255,255,255,.12);
  --accent:#2997ff; --accent-fg:#ffffff; --sel:rgba(41,151,255,.20); --warn:#ffb340; --scrim:rgba(0,0,0,.55);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f5f7; --pane:#ffffff; --raise:#ececf0; --fg:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.10);
  --accent:#0071e3; --sel:rgba(0,113,227,.12); --warn:#9a5b00; --scrim:rgba(0,0,0,.30); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.bar{display:flex;align-items:center;gap:12px;flex:none;flex-wrap:wrap}
.bar h1{font-size:18px;margin:0 6px 0 0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--raise);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font-weight:600;padding:5px 16px;border-radius:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--pane);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pick{flex:1;min-width:220px;max-width:460px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:0;background:var(--raise);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left}
.pick span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick small{color:var(--muted)} .pick kbd{color:var(--muted);font:12px var(--font);flex:none}
.ibtn{border:0;background:var(--raise);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.ibtn:hover,.pick:hover,.seg button:hover{background:var(--sel)}

/* Split */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--l,1fr)) 12px minmax(0,var(--r,1fr))}
.pane{background:var(--pane);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
.divider{cursor:col-resize;position:relative;touch-action:none}
.divider::after{content:"";position:absolute;inset:calc(50% - 22px) 4px;border-radius:2px;background:var(--line)}
.divider:hover::after,.divider.drag::after{background:var(--accent)}

/* Tab pane */
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 8px;flex:none}
.ph h2{margin:0;font-size:20px;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .sub{color:var(--muted);font-size:13px;margin-top:2px}
.menu{position:relative;flex:none}
.menu summary{list-style:none;cursor:pointer;background:var(--raise);border-radius:10px;padding:7px 14px;font-weight:600;color:var(--accent)}
.menu summary::-webkit-details-marker{display:none}
.menu .items{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:230px;background:var(--raise);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu .items a{display:block;padding:9px 12px;border-radius:8px;color:var(--fg);text-decoration:none}
.menu .items a:hover{background:var(--sel)}
.menu .items small{display:block;color:var(--muted)}
.tools{display:flex;gap:8px;padding:0 18px 8px;flex:none;flex-wrap:wrap;align-items:center}
.tools button{border:0;background:var(--raise);border-radius:8px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer}
.tools button:hover{background:var(--sel)}
.tools .grow{flex:1}
.tools #openTab{color:var(--accent)}
.tabarea{flex:1;min-height:0;position:relative;display:flex}
textarea#tab{flex:1;width:100%;border:0;resize:none;outline:none;background:transparent;color:var(--fg);
  font:var(--fs,17px)/1.35 var(--mono);padding:8px 18px 18px;white-space:pre;overflow:auto;tab-size:4;font-variant-ligatures:none}
textarea#tab::placeholder{color:transparent}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--muted);pointer-events:none}
.empty b{color:var(--fg);font-size:18px;font-weight:600}
.empty p{margin:0;max-width:34ch}
.empty[hidden]{display:none}

/* Video pane */
.vid{flex:1;min-height:0;background:#000;position:relative}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vf{display:flex;align-items:center;gap:10px;padding:12px 18px;flex:none;flex-wrap:wrap}
.vf a{color:var(--accent);text-decoration:none;font-weight:600}
.vf .muted{color:var(--muted);font-size:13px}
.vf .warn{color:var(--warn);font-size:13px}

/* Picker */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none;margin:0;width:100%;height:100%}
dialog::backdrop{background:var(--scrim);backdrop-filter:blur(6px)}
.sheet{position:absolute;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));max-height:72vh;
  background:var(--pane);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.sheet input{border:0;outline:none;background:transparent;color:var(--fg);font:18px var(--font);padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet input::placeholder{color:var(--muted)}
.results{overflow-y:auto;padding:6px}
.res{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer}
.res[aria-selected="true"]{background:var(--sel)}
.res .n{width:22px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;flex:none}
.res b{display:block;font-weight:600} .res span.s{display:block;color:var(--muted);font-size:13px}
.res div{min-width:0}.res b,.res span.s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.none{padding:22px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  html,body{height:auto}
  .split{display:flex;flex-direction:column;gap:12px}
  .divider{display:none}
  .pane.v{order:-1}
  .vid{flex:none;aspect-ratio:16/9}
  .tabarea{min-height:46vh}
}
@media (prefers-reduced-motion:no-preference){.ibtn,.pick,.seg button,.res{transition:background .12s}}
</style>
</head>
<body>
<div class="bar">
  <h1>Practice Room</h1>
  <div class="seg" role="tablist" aria-label="Guitar type">
    <button role="tab" aria-selected="true" data-tab="electric">Electric</button>
    <button role="tab" aria-selected="false" data-tab="acoustic">Acoustic</button>
  </div>
  <button class="pick" id="pick" aria-label="Choose a song"><span id="pickLabel"></span><kbd id="kbd">⌘K</kbd></button>
  <button class="ibtn" id="prev" aria-label="Previous song">‹</button>
  <button class="ibtn" id="next" aria-label="Next song">›</button>
  <button class="ibtn" id="theme" aria-label="Switch light and dark">Light</button>
</div>

<div class="split" id="split">
  <section class="pane" aria-label="Tab">
    <div class="ph">
      <div style="min-width:0"><h2 id="tabTitle"></h2><div class="sub" id="tabSub"></div></div>
      <details class="menu" id="menu"><summary>Sources</summary><div class="items" id="sources"></div></details>
    </div>
    <div class="tools">
      <button id="openTab" title="Opens GuitarTabs for this song in its own window, sized to the left half of your screen">Open tab window</button>
      <button id="paste">Paste</button>
      <button id="clear">Clear</button>
      <span class="grow"></span>
      <button id="fsm" aria-label="Smaller text">A&minus;</button>
      <button id="fsp" aria-label="Larger text">A+</button>
    </div>
    <div class="tabarea">
      <textarea id="tab" spellcheck="false" aria-label="Tab for this song" placeholder="x"></textarea>
      <div class="empty" id="empty"><b>No tab yet</b><p>Click Open tab window, copy the tab, then click Paste. It stays on this computer.</p></div>
    </div>
  </section>
  <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0" title="Drag to resize. Double-click to reset."></div>
  <section class="pane v" aria-label="Video">
    <div class="vid" id="vid"></div>
    <div class="vf" id="vf"></div>
  </section>
</div>

<dialog id="dlg" aria-label="Choose a song">
  <div class="sheet"><input id="q" type="search" placeholder="Search songs or artists" aria-label="Search songs or artists" autocomplete="off"><div class="results" id="results" role="listbox"></div></div>
</dialog>

<script>
/* Song data. vid = YouTube video ID read from YouTube's own results.
   sid = Songsterr song ID and tuning = the guitar tuning listed on that Songsterr page.
   cc = Songsterr has a chord chart for it. fan = fan upload (may not embed). */
const SONGS = {
electric: [
 {a:"Nirvana", t:"Smells Like Teen Spirit", vid:"hTWKbfoikeg", sid:269, tun:"E standard", cc:1},
 {a:"Soundgarden", t:"Black Hole Sun", vid:"3mbBbFH9fAg", sid:227, tun:"Drop D", cc:1},
 {a:"Pearl Jam", t:"Black", vid:"qgaRVvAKoqQ", sid:15712, tun:"E standard", cc:1, v:"Official audio"},
 {a:"Alice in Chains", t:"Would?", vid:"Nco_kh8xJDs", sid:59895, tun:"Eb standard (half step down)", cc:1},
 {a:"Temple of the Dog", t:"Hunger Strike", vid:"VUb450Alpps", sid:20288, tun:"Drop D", cc:1},
 {a:"Stone Temple Pilots", t:"Plush", vid:"V5UOC0C0x8Q", sid:293, tun:"E standard", cc:1},
 {a:"The Smashing Pumpkins", t:"Cherub Rock", vid:"q-KE9lvU810", sid:18072, tun:"E standard", cc:0},
 {a:"Rage Against the Machine", t:"Killing in the Name", vid:"bWXazVhlyxQ", sid:360, tun:"Drop D", cc:0},
 {a:"Metallica", t:"Enter Sandman", vid:"CD-E-LDc384", sid:19, tun:"E standard", cc:1},
 {a:"Red Hot Chili Peppers", t:"Give It Away", vid:"Mr_uHJPUlO8", sid:14050, tun:"E standard", cc:0},
 {a:"Green Day", t:"Basket Case", vid:"NUTGr5t3MoY", sid:1401, tun:"Eb standard (half step down)", cc:1},
 {a:"Radiohead", t:"Creep", vid:"XFkzRNyygfk", sid:97, tun:"E standard", cc:1},
 {a:"Oasis", t:"Live Forever", vid:"TDe1DqxwJoc", sid:49260, tun:"E standard", cc:1},
 {a:"Screaming Trees", t:"Nearly Lost You", vid:"PE5f561Y1x4", sid:29352, tun:"E standard", cc:1},
 {a:"Incubus", t:"Drive", vid:"fgT9zGkiLig", sid:327, tun:"E standard", cc:1},
 {a:"Blind Melon", t:"No Rain", vid:"3qVPNONdF58", sid:3249, tun:"E standard", cc:1},
 {a:"Foo Fighters", t:"Monkey Wrench", vid:"I7rCNiiNPxA", sid:7754, tun:"Drop D", cc:1},
 {a:"Mad Season", t:"River of Deceit", vid:"Fm72DPJCX58", sid:42329, tun:"E standard", cc:0},
 {a:"Hole", t:"Celebrity Skin", vid:"O3dWBLoU--E", sid:8801, tun:"E standard", cc:0},
 {a:"The Cranberries", t:"Zombie", vid:"6Ejga4kJUts", sid:431, tun:"E standard", cc:1}
],
acoustic: [
 {a:"Nirvana", t:"About a Girl", v:"MTV Unplugged", vid:"AhcttcXcRYY", sid:486558, tun:"Eb standard (half step down)", cc:0},
 {a:"Alice in Chains", t:"Nutshell", v:"MTV Unplugged", vid:"9EKi2E9dVY8", sid:407449, tun:"Eb standard (half step down)", cc:0},
 {a:"Pearl Jam", t:"Elderly Woman Behind the Counter in a Small Town", v:"Official audio", vid:"4YFYNUu_sqE", sid:15348, tun:"E standard", cc:0},
 {a:"Chris Cornell", t:"Seasons", vid:"1DnSiznUrVI", sid:28285, tun:"Open tuning. Songsterr lists F F C C C F, low to high. Check the tab.", cc:0, warn:1},
 {a:"Foo Fighters", t:"Everlong", v:"Acoustic", vid:"YLRlOvzs-XU", sid:7518, tun:"Drop D", cc:1},
 {a:"Hole", t:"Doll Parts", v:"MTV Unplugged 1995, fan upload", vid:"gsfP8uWLYkA", sid:9290, tun:"E standard", cc:1, fan:1},
 {a:"Eric Clapton", t:"Tears in Heaven", v:"Unplugged", vid:"tUU1GLMdnkM", sid:4, tun:"E standard", cc:1},
 {a:"R.E.M.", t:"Losing My Religion", vid:"xwtdhWltSIg", sid:16245, tun:"E standard", cc:1},
 {a:"Oasis", t:"Half the World Away", v:"Lyric video", vid:"Tiqxn3iOmxY", sid:15025, tun:"E standard", cc:1},
 {a:"Radiohead", t:"Fake Plastic Trees", vid:"n5h0qHwNrHk", sid:161, tun:"E standard", cc:1},
 {a:"Green Day", t:"Good Riddance (Time of Your Life)", vid:"CnQ8N1KacJc", sid:75, tun:"E standard", cc:1},
 {a:"Goo Goo Dolls", t:"Name", vid:"yQOBUrRaPU0", sid:8050, tun:"Altered tuning. Songsterr lists D A E A E E, low to high. A standard-tuning version is also on Songsterr (ID 6679878).", cc:1, warn:1},
 {a:"Dave Matthews Band", t:"Crash Into Me", vid:"k7in-9E3ImQ", sid:245, tun:"E standard", cc:1},
 {a:"The Beatles", t:"Blackbird", vid:"Man4Xw8Xypo", sid:57, tun:"E standard", cc:1},
 {a:"Bob Dylan", t:"Don't Think Twice, It's All Right", v:"Official audio", vid:"1iHhWh9FtsQ", sid:6533, tun:"E standard", cc:1},
 {a:"Simon & Garfunkel", t:"The Boxer", v:"Audio", vid:"l3LFML_pxlY", sid:18502, tun:"Eb standard (half step down). An E standard version is on Songsterr (ID 448944).", cc:1},
 {a:"Donovan", t:"Catch the Wind", v:"Fan upload", vid:"9yQKDj_V4Gk", sid:30268, tun:"Eb standard (half step down)", cc:1, fan:1},
 {a:"Leonard Cohen", t:"Suzanne", v:"Official audio", vid:"svitEEpI07E", sid:23026, tun:"E standard", cc:1},
 {a:"Joni Mitchell", t:"Both Sides, Now", v:"2021 remaster", vid:"yXr2EFomFkU", sid:39938, tun:"Drop D on Songsterr. Joni often used open tunings, so check the tab.", cc:1, warn:1},
 {a:"Nick Drake", t:"Time Has Told Me", vid:"G8SmkwS82u4", sid:230677, tun:"E standard on Songsterr. Nick Drake often used altered tunings, so check the tab.", cc:1, warn:1}
]
};


const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
const esc = x => String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const isMac = /Mac|iPhone|iPad/.test(navigator.platform||''); $('#kbd').textContent = isMac ? '⌘K' : 'Ctrl K';

let tab = store.get('pr.tab','electric'); if(!SONGS[tab]) tab='electric';
let sel = parseInt(store.get('pr.sel.'+tab,'0'),10)||0;
const cur = () => SONGS[tab][sel];
const key = s => tab+'|'+s.a+'|'+s.t;
const gtUrl = s => `https://www.guitartabs.cc/search.php?tabtype=any&band=${enc(s.a.replace(/^The /,''))}&song=${enc(s.t)}`;

/* Theme: dark by default */
function setTheme(t){ document.documentElement.dataset.theme=t; $('#theme').textContent = t==='dark'?'Light':'Dark'; store.set('pr.theme',t); }
setTheme(store.get('pr.theme','dark')==='light'?'light':'dark');
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* Render the current song */
function render(){
  const s = cur(); if(!s) return;
  const full = s.a+' '+s.t;
  $('#pickLabel').innerHTML = `${esc(s.t)} <small>${esc(s.a)}</small>`;
  $('#tabTitle').textContent = s.t;
  $('#tabSub').textContent = `${s.a}${s.v?' · '+s.v:''} · ${s.tun}`;
  $('#sources').innerHTML = [
    `<a href="${gtUrl(s)}" target="_blank" rel="noopener">GuitarTabs<small>All versions of this song</small></a>`,
    `<a href="https://www.songsterr.com/a/wsa/x-tab-s${s.sid}" target="_blank" rel="noopener">Songsterr tab</a>`,
    s.cc ? `<a href="https://www.songsterr.com/a/wsa/x-chords-s${s.sid}" target="_blank" rel="noopener">Songsterr chords</a>` : '',
    `<a href="https://www.ultimate-guitar.com/search.php?search_type=title&value=${enc(full)}" target="_blank" rel="noopener">Ultimate Guitar</a>`,
    `<a href="https://musescore.com/sheetmusic?text=${enc(full)}" target="_blank" rel="noopener">MuseScore sheet music<small>User uploads</small></a>`
  ].join('');
  $('#menu').open = false;
  const ta = $('#tab'); ta.value = store.get('pr.tabtext.'+key(s),''); $('#empty').hidden = !!ta.value; ta.scrollTop=0; ta.scrollLeft=0;
  $('#vid').innerHTML = `<iframe title="${esc(full)}" src="https://www.youtube.com/embed/${s.vid}?rel=0&modestbranding=1&playsinline=1"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  $('#vf').innerHTML = `<a href="https://www.youtube.com/watch?v=${s.vid}" target="_blank" rel="noopener">Video not playing? Watch on YouTube</a>`
    + (s.fan?'<span class="warn">Fan upload, so embedding may be blocked.</span>':'')
    + (s.warn?'<span class="warn">Check the tuning on the tab before you tune up.</span>':'');
  document.title = `${s.t} · Practice Room`;
}
/* Clean pasted tab: plain text only, tidy line endings, drop [tab] and [ch] markup, keep spacing exact */
function cleanTab(t){
  return t.replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').replace(/\[\/?(tab|ch|\/?b)\]/gi,'').replace(/[ \t]+$/gm,'').replace(/^\n+|\n+$/g,'');
}
function saveTab(v){ const ta=$('#tab'); ta.value=v; store.set('pr.tabtext.'+key(cur()),v); $('#empty').hidden=!!v; ta.scrollTop=0; ta.scrollLeft=0; }
$('#tab').addEventListener('paste',e=>{
  const t=(e.clipboardData&&e.clipboardData.getData('text/plain'))||''; if(!t) return;
  e.preventDefault(); const ta=e.target;
  if(!ta.value.trim()){ saveTab(cleanTab(t)); }
  else { const a=ta.selectionStart,b=ta.selectionEnd; ta.setRangeText(cleanTab(t),a,b,'end'); store.set('pr.tabtext.'+key(cur()),ta.value); $('#empty').hidden=!ta.value; }
});
$('#paste').onclick=async()=>{
  try{ const t=await navigator.clipboard.readText(); if(t.trim()) saveTab(cleanTab(t)); else $('#tab').focus(); }
  catch(e){ $('#tab').focus(); $('#empty').querySelector('p').textContent='Chrome blocked the Paste button. Click in the box and press Ctrl V instead.'; }
};
$('#clear').onclick=()=>{ if($('#clear').dataset.arm==='1'){ saveTab(''); $('#clear').textContent='Clear'; $('#clear').dataset.arm=''; } else { $('#clear').dataset.arm='1'; $('#clear').textContent='Sure?'; setTimeout(()=>{ $('#clear').dataset.arm=''; $('#clear').textContent='Clear'; },2500); } };
$('#openTab').onclick=()=>{
  const w=Math.floor((screen.availWidth||1200)/2), h=screen.availHeight||800, l=(screen.availLeft||0);
  const win=window.open(gtUrl(cur()),'tabwin',`popup=yes,left=${l},top=0,width=${w},height=${h}`);
  if(!win) window.open(gtUrl(cur()),'_blank','noopener');
};
let fs=parseInt(store.get('pr.fs','17'),10)||17;
function setFs(n){ fs=Math.min(30,Math.max(11,n)); document.documentElement.style.setProperty('--fs',fs+'px'); store.set('pr.fs',String(fs)); }
setFs(fs); $('#fsm').onclick=()=>setFs(fs-1); $('#fsp').onclick=()=>setFs(fs+1);
$('#tab').addEventListener('input',e=>{ store.set('pr.tabtext.'+key(cur()),e.target.value); $('#empty').hidden=!!e.target.value; });

function select(i){ sel=i; store.set('pr.sel.'+tab,String(i)); render(); }
function move(d){ const n=SONGS[tab].length; select((sel+d+n)%n); }
function setTab(t){ tab=t; store.set('pr.tab',t); sel=parseInt(store.get('pr.sel.'+t,'0'),10)||0;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t))); render(); }
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('#prev').onclick=()=>move(-1); $('#next').onclick=()=>move(1);

/* Song picker */
const dlg=$('#dlg'), q=$('#q'), results=$('#results'); let hits=[], hi=0;
function drawResults(){
  const t=norm(q.value.trim());
  hits=SONGS[tab].map((s,i)=>({s,i})).filter(({s})=>!t||norm(s.a+' '+s.t+' '+(s.v||'')).includes(t));
  hi=Math.min(hi,Math.max(0,hits.length-1));
  results.innerHTML = hits.length ? hits.map(({s,i},k)=>`<button class="res" role="option" data-k="${k}" aria-selected="${k===hi}"><span class="n">${i+1}</span><div><b>${esc(s.t)}</b><span class="s">${esc(s.a)}${s.v?' · '+esc(s.v):''}</span></div></button>`).join('')
    : `<div class="none">No songs match "${esc(q.value)}".</div>`;
  const el=results.querySelector('[aria-selected="true"]'); if(el) el.scrollIntoView({block:'nearest'});
}
function openPicker(){ q.value=''; hi=Math.max(0,sel); dlg.showModal(); drawResults(); q.focus(); }
function choose(k){ if(hits[k]){ select(hits[k].i); dlg.close(); } }
$('#pick').onclick=openPicker;
q.addEventListener('input',()=>{ hi=0; drawResults(); });
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); hi=Math.min(hi+1,hits.length-1); drawResults(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); hi=Math.max(hi-1,0); drawResults(); }
  else if(e.key==='Enter'){ e.preventDefault(); choose(hi); }
});
results.addEventListener('click',e=>{ const b=e.target.closest('.res'); if(b) choose(parseInt(b.dataset.k,10)); });
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); dlg.open?dlg.close():openPicker(); return; }
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||dlg.open) return;
  if(e.key==='ArrowRight'||e.key==='n'){ move(1); } if(e.key==='ArrowLeft'||e.key==='p'){ move(-1); }
});

/* Draggable divider. Ratio is remembered. */
const split=$('#split'), div=$('#divider');
function setRatio(r){ r=Math.min(0.8,Math.max(0.2,r)); split.style.setProperty('--l',r+'fr'); split.style.setProperty('--r',(1-r)+'fr'); store.set('pr.ratio',String(r)); }
setRatio(parseFloat(store.get('pr.ratio','0.5'))||0.5);
div.addEventListener('pointerdown',e=>{ div.setPointerCapture(e.pointerId); div.classList.add('drag'); document.querySelector('#vid').style.pointerEvents='none'; });
div.addEventListener('pointermove',e=>{ if(!div.classList.contains('drag')) return; const b=split.getBoundingClientRect(); setRatio((e.clientX-b.left)/b.width); });
const end=()=>{ div.classList.remove('drag'); document.querySelector('#vid').style.pointerEvents=''; };
div.addEventListener('pointerup',end); div.addEventListener('pointercancel',end);
div.addEventListener('dblclick',()=>setRatio(0.5));
div.addEventListener('keydown',e=>{ const r=parseFloat(store.get('pr.ratio','0.5'))||0.5;
  if(e.key==='ArrowLeft'){ e.preventDefault(); setRatio(r-0.02) } if(e.key==='ArrowRight'){ e.preventDefault(); setRatio(r+0.02) } if(e.key==='Home'){ setRatio(0.5) } });

setTab(tab);
</script>
</body>
</html>
